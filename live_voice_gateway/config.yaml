name: Live Voice Gateway
version: "0.2.3"
slug: live_voice_gateway
description: Full-duplex GPT-Live voice gateway for Home Assistant Voice PE
url: https://github.com/SandorDrift23/LiveVoiceGateway
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
homeassistant_api: true

# Each mapping is one section on the configuration page. Home Assistant can
# open and close a section; it cannot draw a multi-line text box, so long
# instructions are edited with Configuration → ⋮ → Edit in YAML.
# Fields listed only in schema stay hidden until
# "Show unused optional configuration options" is enabled.
options:
  openai_api_key: ""
  instructions:
    reply_instructions: >-
      Keep answers short and natural. Usually use one or two sentences. Do not
      use markdown, URLs, or entity IDs.
    smart_home_instructions: >-
      Hand a device request to the backend as soon as it is clear. Forward the
      user's words without adding or removing a room, place, or device name.
      Do not ask which device they mean before the backend answers. If the
      result lists several matches, ask one short question.
    web_search_instructions: >-
      Ask the backend for current facts such as weather, news, opening hours,
      and prices. If you already know the answer, say it directly. Speak the
      backend's result. Do not pretend to look something up.
    extra_instructions: ""
    backend_instructions: >-
      For a device request, call the one control function that performs the
      action, in the same step. Do not call GetLiveContext or any lookup first.
      Drop German articles (der, die, das, den, dem, des, ein, eine, einen) and
      the verb. Do not translate the remaining name. Set area only when the
      user names a room, such as 'im Schlafzimmer', and pass that room
      unchanged. Never set area or the device name from the home city,
      timezone, or weather location. If the user describes a kind of device at
      a spot, such as 'die Lampe am Sofa', pass the spot as the device name and
      the kind as the domain. If several devices match, return that list and
      do not guess. Use web search only for current external facts such as
      weather, news, opening hours, and prices. Never use web search for a
      device request or for an answer you already know.
  basic:
    assistant_name: Nabu
    language: de
    openai_voice: "juni - German (feminine)"
    expression: Warm, friendly, and natural.
    home_location: ""
    timezone: Europe/Berlin
    speaking_speed: normal
    unit_system: metric
    conversation_idle_timeout: 12
    reconnect_grace_seconds: 8
  web_search:
    enable_web_search: true
    web_search_idle_timeout: 45
    backend_model: "gpt-5.4-nano - lower budget (recommended)"
    web_search_max_sentences: 2
  home_assistant:
    enable_home_assistant: true
    ha_mcp_api: assist
    mcp_request_timeout: 20
    websocket_port: 8080
    log_transcripts: true
    log_tool_calls: true
  music_assistant:
    enable_music_assistant: false
    default_media_player: ""

schema:
  openai_api_key: password
  instructions:
    reply_instructions: str
    smart_home_instructions: str
    web_search_instructions: str
    extra_instructions: str?
    backend_instructions: str
  basic:
    assistant_name: str
    language: str
    openai_voice: "list(marin - English (recommended)|cedar - English (recommended)|alloy - English|ash - English|ballad - English|coral - English|echo - English|sage - English|shimmer - English|verse - English|quartz - English (Australian, feminine)|ripple - English (Australian, masculine)|vesper - English (British, masculine)|willow - English (Irish, feminine)|stone - English (Irish, masculine)|gleam - English (North American, feminine)|meridian - English (North American, masculine)|beacon - English (Filipino, masculine)|delta - English (Southern US, feminine)|cinder - English (Southern US, masculine)|bossa - Portuguese (Brazilian, feminine)|tempo - Portuguese (Brazilian, masculine)|nuri - German (feminines)|juni - German (feminine)|flitz - German (masculine)|brise - French (feminine)|sillage - French (masculine)|nira - Hindi (feminine)|harema - Japanese (feminine)|shida - Japanese (masculine)|noeul - Korean (feminine))"
    expression: str
    home_location: str?
    timezone: str
    speaking_speed: "list(slow|normal|fast)"
    unit_system: "list(metric|us)"
    conversation_idle_timeout: "float(2,120)"
    reconnect_grace_seconds: "float(1,60)"
  web_search:
    enable_web_search: bool
    web_search_idle_timeout: "float(2,180)"
    backend_model: "list(gpt-5.4-mini - low budget|gpt-5-mini - lower budget|gpt-5.4-nano - lower budget (recommended)|gpt-5-nano - minimum budget)"
    web_search_max_sentences: "int(1,5)"
    live_url: str?
  home_assistant:
    enable_home_assistant: bool
    ha_mcp_api: "list(assist|all)"
    mcp_request_timeout: "float(1,120)"
    ha_mcp_url: str?
    ha_access_token: password?
    mcp_tool_allowlist: str?
    websocket_port: "int(1,65535)"
    log_transcripts: bool
    log_tool_calls: bool
  music_assistant:
    enable_music_assistant: bool
    ma_mcp_url: str?
    ma_access_token: password?
    default_media_player: str?
    ma_tool_allowlist: str?

name: Live Voice Gateway
version: "0.2.2"
slug: live_voice_gateway
description: Full-duplex GPT-Live voice gateway for Home Assistant Voice PE
url: https://github.com/SandorDrift23/LiveVoiceGateway
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
homeassistant_api: true

# Each mapping is one section on the configuration page. Home Assistant can
# open and close a section; it cannot draw a multi-line text box, so long
# instructions are edited with Configuration → ⋮ → Edit in YAML.
# Fields listed only in schema stay hidden until
# "Show unused optional configuration options" is enabled.
options:
  openai_api_key: ""
  instructions:
    reply_instructions: >-
      Keep answers short and natural. Usually use one or two sentences. Do not
      use markdown, URLs, or entity IDs.
    smart_home_instructions: >-
      For a device request, call one Home Assistant tool immediately. Pass only the device name the user said, unchanged and untranslated. Do not add a room. Ask one short question only after the tool reports several matches.
    web_search_instructions: >-
      Use web search only for current facts such as weather, news, opening hours,
      and prices. Do not search for a smart-home request or for something you can
      answer directly. Speak the result. Do not pretend to look something up.
    extra_instructions: ""
    backend_instructions: >-
      Use web search only when the answer depends on current external
      information. Never use web search for a smart-home request. For a device
      request, call one Home Assistant function and return only what that tool
      result says. Do not claim a device changed unless the tool result confirms
      it. Answer from general knowledge when no tool is needed.
  basic:
    assistant_name: Live
    language: en
    openai_voice: "marin - English (recommended)"
    expression: Warm, friendly, and natural.
    home_location: ""
    timezone: Europe/Berlin
    speaking_speed: normal
    unit_system: metric
    conversation_idle_timeout: 12
    reconnect_grace_seconds: 8
  web_search:
    enable_web_search: true
    web_search_idle_timeout: 45
    backend_model: "gpt-5.4-nano - lower budget (recommended)"
    web_search_max_sentences: 2
  home_assistant:
    enable_home_assistant: true
    ha_mcp_api: assist
    mcp_request_timeout: 20
    websocket_port: 8080
    log_transcripts: true
    log_tool_calls: true

schema:
  openai_api_key: password
  instructions:
    reply_instructions: str
    smart_home_instructions: str
    web_search_instructions: str
    extra_instructions: str?
    backend_instructions: str
  basic:
    assistant_name: str
    language: str
    openai_voice: "list(marin - English (recommended)|cedar - English (recommended)|alloy - English|ash - English|ballad - English|coral - English|echo - English|sage - English|shimmer - English|verse - English|quartz - English (Australian, feminine)|ripple - English (Australian, masculine)|vesper - English (British, masculine)|willow - English (Irish, feminine)|stone - English (Irish, masculine)|gleam - English (North American, feminine)|meridian - English (North American, masculine)|beacon - English (Filipino, masculine)|delta - English (Southern US, feminine)|cinder - English (Southern US, masculine)|bossa - Portuguese (Brazilian, feminine)|tempo - Portuguese (Brazilian, masculine)|nuri - German (feminine)|juni - German (feminine)|flitz - German (masculine)|brise - French (feminine)|sillage - French (masculine)|nira - Hindi (feminine)|harema - Japanese (feminine)|shida - Japanese (masculine)|noeul - Korean (feminine))"
    expression: str
    home_location: str?
    timezone: str
    speaking_speed: "list(slow|normal|fast)"
    unit_system: "list(metric|us)"
    conversation_idle_timeout: "float(2,120)"
    reconnect_grace_seconds: "float(1,60)"
  web_search:
    enable_web_search: bool
    web_search_idle_timeout: "float(2,180)"
    backend_model: "list(gpt-5.4-mini - low budget|gpt-5-mini - lower budget|gpt-5.4-nano - lower budget (recommended)|gpt-5-nano - minimum budget)"
    web_search_max_sentences: "int(1,5)"
    live_url: str?
  home_assistant:
    enable_home_assistant: bool
    ha_mcp_api: "list(assist|all)"
    mcp_request_timeout: "float(1,120)"
    ha_mcp_url: str?
    ha_access_token: password?
    mcp_tool_allowlist: str?
    websocket_port: "int(1,65535)"
    log_transcripts: bool
    log_tool_calls: bool
